#import "./pool-tokens.graphql"

query GetPool($id: String!, $chain: GqlChain!, $userAddress: String) {
  pool: poolGetPool(id: $id, chain: $chain, userAddress: $userAddress) {
    address
    chain
    createTime
    decimals
    dynamicData {
      aprItems {
        apr
        id
        rewardTokenAddress
        rewardTokenSymbol
        title
        type
      }
      fees24h
      holdersCount
      isInRecoveryMode
      isPaused
      poolId
      surplus24h
      swapEnabled
      swapFee
      totalLiquidity
      totalShares
      volume24h
    }
    factory
    hasErc4626
    hasNestedErc4626
    hook {
      ...Hook
    }
    id
    liquidityManagement {
      disableUnbalancedLiquidity
    }
    name
    pauseManager
    poolCreator
    poolTokens {
      ...PoolTokens
    }
    protocolVersion
    swapFeeManager
    symbol
    tags
    type
    userBalance {
      totalBalance
      totalBalanceUsd
      walletBalance
      walletBalanceUsd
    }
    version
    ... on GqlPoolEclp {
      alpha
      beta
      c
      dSq
      lambda
      s
      tauAlphaX
      tauAlphaY
      tauBetaX
      tauBetaY
      type
      u
      v
      w
      z
    }
    ... on GqlPoolStable {
      amp
      bptPriceRate
    }
  }
}

query GetPoolSnapshots($poolId: String!, $range: GqlPoolSnapshotDataRange!, $chainId: GqlChain!) {
  snapshots: poolGetSnapshots(id: $poolId, range: $range, chain: $chainId) {
    id
    timestamp
    totalLiquidity
    volume24h
    fees24h
    surplus24h
    sharePrice
  }
}

query GetPoolEvents(
  $first: Int
  $skip: Int
  $poolId: String
  $chainIn: [GqlChain!]!
  $type: GqlPoolEventType
  $userAddress: String
) {
  poolEvents(
    first: $first
    skip: $skip
    where: { poolId: $poolId, chainIn: $chainIn, type: $type, userAddress: $userAddress }
  ) {
    id
    poolId
    timestamp
    tx
    type
    valueUSD
    chain
    userAddress
    ... on GqlPoolSwapEventV3 {
      sender
      tokenIn {
        address
        amount
      }
      tokenOut {
        address
        amount
      }
    }
    ... on GqlPoolAddRemoveEventV3 {
      tokens {
        address
        amount
        valueUSD
      }
    }
  }
}
