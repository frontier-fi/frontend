packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # Git-hosted Frontier fork — prepare runs tsup to produce dist/
  "@balancer/sdk": true
  "@balancer/sdk@https://codeload.github.com/frontier-fi/sdk/tar.gz/cd309ed8873386c00f5e65342bb73641e3503dc8": true
  "@parcel/watcher": true
  "@reown/appkit": true
  bufferutil: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  utf-8-validate: true

catalog:
  "@apollo/client": "4.3.4"

packageExtensions:
  # debug declares only optional peer metadata. Declare the peer explicitly so
  # the removal override runs before pnpm infers a wildcard peer from metadata.
  debug:
    peerDependencies:
      supports-color: "*"

peerDependencyRules:
  allowedVersions:
    "@types/react": ^19.0.0
    "@types/react-dom": ^19.0.0
    react: ^19.0.0
    react-dom: ^19.0.0
    # Accept MSW 3 for @vitest/mocker's optional peer to avoid duplicate Vitest instances.
    msw: ">=2.4.9"

overrides:
  # Frontier fork until published to npm (Sepolia vault/router addresses).
  "@balancer/sdk": "github:frontier-fi/sdk#cd309ed8873386c00f5e65342bb73641e3503dc8"
  "@balancer-labs/balancer-maths": "npm:@frontier-fi/maths@0.1.1"
  # Remove debug's optional color peer so every app shares the same
  # Chakra/Emotion/Next instances (see PR #2883). Keep this declarative:
  # Renovate disables pnpmfile hooks when generating lockfiles.
  "debug>supports-color": "-"
  "@types/react": "19.3"
  "@types/react-dom": "19.3"
  # Keep @vitest/mocker on the same MSW version as the test handlers.
  "@vitest/mocker>msw": "3.0.3"

publicHoistPattern:
  - "*graphql*" # https://github.com/vercel/next.js/issues/68805
  - "@reown/*" # Fix for @reown/appkit resolution in Next + pnpm

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - "@balancer/sdk"
  - "@frontier-fi/*"
