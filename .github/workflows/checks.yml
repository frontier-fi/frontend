name: Checks

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

env:
  NEXT_PUBLIC_API_URL: https://api.frontier.fi/graphql
  NEXT_PUBLIC_WALLET_CONNECT_ID: ${{ secrets.NEXT_PUBLIC_WALLET_CONNECT_ID }}

jobs:
  Docker-Build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: frontier-frontend:test
          build-args: |
            NEXT_PUBLIC_APP_ENV=prod
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WALLET_CONNECT_ID=${{ env.NEXT_PUBLIC_WALLET_CONNECT_ID }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container healthcheck
        run: |
          docker run -d --name frontier-web -p 8080:8080 frontier-frontend:test
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'; then
              echo "Container healthcheck passed"
              docker rm -f frontier-web
              exit 0
            fi
            sleep 1
          done
          docker logs frontier-web
          docker rm -f frontier-web
          exit 1

  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run lint
        run: pnpm lint
      - name: Run prettier
        run: pnpm prettier
      - name: Run stylelint
        run: pnpm stylelint

  Unit-Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run typecheck
        env:
          NODE_OPTIONS: "--max_old_space_size=6144"
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test:unit
      #  Uncomment to debug turborepo summary when running with --summarize option
      #  Context: https://turbo.build/repo/docs/crafting-your-repository/caching#using-run-summaries
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: unit-turbo-summary
      #     path: |
      #       ./.turbo/runs/
      #     retention-days: 30

  Integration-Test:
    runs-on: ubuntu-latest
    env:
      DRPC_API_KEY: ${{ secrets.DRPC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Set up foundry (includes anvil)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.9.0
        #   cache: false # Disable cache after foundry-toolchain upgrade
      - name: Run integration tests
        run: pnpm test:integration

  E2E-Smoke-Test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run Playwright smoke tests
        run: pnpm test:e2e:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report
          path: |
            ./packages/e2e-tests/playwright-report/
            ./packages/e2e-tests/test-results/
          retention-days: 30

  # Disabled until Ethereum Mainnet is added to PROJECT_CONFIG.supportedNetworks
