name: Checks

on:
  pull_request:
    types: [opened, synchronize]

env:
  NEXT_PUBLIC_API_URL: https://api.frontier.fi/graphql
  NEXT_PUBLIC_WALLET_CONNECT_ID: ${{ secrets.NEXT_PUBLIC_WALLET_CONNECT_ID }}
  DRPC_API_KEY: ${{ secrets.DRPC_API_KEY }}
  TEST_ACCOUNT_MNEMONIC: ${{ secrets.TEST_ACCOUNT_MNEMONIC }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Skip this job as it is already part of the E2E-Smoke-Test job
  # Build:
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10
  #   steps:
  #     - uses: actions/checkout@v5
  #     - name: Setup
  #       uses: ./.github/actions/setup
  #     - name: Run build
  #       env:
  #         NODE_OPTIONS: "--max_old_space_size=4096"
  #       run: pnpm run build

  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run lint
        run: pnpm lint
      - name: Run prettier
        run: pnpm prettier
      - name: Run stylelint
        run: pnpm stylelint

  Unit-Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run typecheck
        env:
          NODE_OPTIONS: "--max_old_space_size=6144"
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test:unit
      #  Uncomment to debug turborepo summary when running with --summarize option
      #  Context: https://turbo.build/repo/docs/crafting-your-repository/caching#using-run-summaries
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: unit-turbo-summary
      #     path: |
      #       ./.turbo/runs/
      #     retention-days: 30

  Integration-Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Set up foundry (includes anvil)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        # with:
        #   cache: false # Disable cache after foundry-toolchain upgrade
      - name: Run integration tests
        run: pnpm test:integration

  E2E-Smoke-Test-Balancer:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    env:
      NEXT_PUBLIC_PROJECT_ID: balancer
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run Playwright smoke tests (Balancer)
        run: pnpm test:e2e:build:bal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report-bal
          path: |
            ./packages/e2e-tests/playwright-report/
            ./packages/e2e-tests/test-results/
          retention-days: 30

  # E2E-Smoke-Test-Analytics:
  #   timeout-minutes: 15
  #   runs-on: ubuntu-latest
  #   container:
  #     image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
  #   env:
  #     PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
  #     - name: Setup
  #       uses: ./.github/actions/setup
  #     - name: Run Playwright smoke tests (Analytics)
  #       run: pnpm test:e2e:build:analytics
  #     - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
  #       if: ${{ !cancelled() }}
  #       with:
  #         name: playwright-smoke-report-analytics
  #         path: |
  #           ./packages/e2e-tests/playwright-report/
  #           ./packages/e2e-tests/test-results/
  #         retention-days: 30

  E2E-Dev-Test-Balancer:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    strategy:
      fail-fast: false
      matrix:
        # tests/dev/balancer is split by whole spec files (see
        # packages/e2e-tests/scripts/shard-specs.mjs), so adding a spec no longer
        # means rebalancing hardcoded file lists. `id` only names artifacts —
        # shard values contain a slash.
        include:
          - id: 1
            shard: 1/3
          - id: 2
            shard: 2/3
          - id: 3
            shard: 3/3
    env:
      NEXT_PUBLIC_PROJECT_ID: balancer
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      E2E_SHARD: ${{ matrix.shard }}
      E2E_FORK_BLOCK_NUMBER: 26038000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Set up foundry (includes anvil)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      - name: Start anvil fork in mainnet
        run: anvil --mnemonic "${{ env.TEST_ACCOUNT_MNEMONIC }}" --fork-url "https://lb.drpc.live/ethereum/${{ env.DRPC_API_KEY }}" --fork-block-number ${{ env.E2E_FORK_BLOCK_NUMBER }} --fork-retry-backoff 1000 --no-rate-limit --port 8545 &
      - name: Run Playwright dev tests (Balancer shard ${{ matrix.shard }})
        run: pnpm test:e2e:dev:bal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-dev-report-bal-${{ matrix.id }}
          path: |
            ./packages/e2e-tests/playwright-report/
            ./packages/e2e-tests/test-results/
          retention-days: 30
